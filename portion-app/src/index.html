<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,wght@1,600&family=Manrope:wght@600;700;800&display=swap">
<style>/* Layout: one phone-sized app; on wide screens it floats on an olive "kitchen counter" beside a journey index. */
:root{--cream:#FAF9F0;--card:#FFFFFF;--oat:#F4F3E8;--oat2:#EBEADD;--ink:#1C1D17;--char:#2F3229;--mute:#6B665A;--apricot:#F2B66D;--apricot-s:#FDE6CC;--caramel:#825514;--cocoa:#5E3D0A;--olive:#5F6130;--butter:#E7E5A6;--butter-s:#F0F0CC;--rose:#F2B0B2;--rose-s:#F8D9D9;--plum:#855053;--red:#B3261E;
--head:'Manrope',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#34361f;color:var(--ink);font:14px/1.5 var(--body);overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4,.hd{font-family:var(--head);letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
h1{font-size:27px;font-weight:800}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:700}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
img{display:block}

#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;background:radial-gradient(1100px 700px at 70% 10%,#6a6c3a 0,#34361f 55%,#222314 100%);padding:16px}
#guide{width:270px;color:#F4F3E0;max-height:100%;overflow:auto}
#guide h1{font-size:34px;letter-spacing:-.03em}
#guide h1 i{display:inline-block;width:9px;height:9px;border-radius:9px;background:var(--apricot);margin-left:5px}
#guide p{color:#cfceaa;margin:6px 0 14px}
#guide ol{list-style:none;margin:0;padding:0;counter-reset:j}
#guide li button{width:100%;display:flex;gap:12px;padding:6px 10px;border-radius:10px;color:#d9d8b8;counter-increment:j;transition:.25s}
#guide li button::before{content:counter(j,decimal-leading-zero);font-size:11px;color:#a5a574;width:18px;padding-top:2px}
#guide li button:hover{background:#ffffff12}
#guide li button.on{background:var(--apricot);color:var(--cocoa);font-weight:700}
#guide li button.on::before{color:var(--cocoa)}
#guide .row{display:flex;gap:8px;margin-top:14px}
#guide .row button{border:1px solid #ffffff38;border-radius:99px;padding:6px 13px;font-size:12px}
#phone{position:relative;width:402px;height:min(868px,100%);border-radius:52px;background:#151610;padding:10px;box-shadow:0 50px 100px -30px #000b,0 0 0 1.5px #77794e inset;flex:none}
#app{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--cream);isolation:isolate}
@media(max-width:859px),(max-height:520px){#guide{display:none}#stage{padding:0;display:block}#phone{width:100%;max-width:520px;height:100%;margin:auto;padding:0;border-radius:0;background:var(--cream);box-shadow:none}#app{border-radius:0}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream)}
.screen.enter{animation:in .5s var(--ease) both}
.screen.enter.back{animation-name:inback}
.screen.leave{animation:out .35s ease both;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateX(34px)}}
@keyframes inback{from{opacity:0;transform:translateX(-34px)}}
@keyframes out{to{opacity:0;transform:scale(.97)}}
.screen.enter .scroll>*{animation:rise .65s var(--ease) both}
.screen.enter .scroll>*:nth-child(2){animation-delay:.06s}.screen.enter .scroll>*:nth-child(3){animation-delay:.12s}.screen.enter .scroll>*:nth-child(4){animation-delay:.18s}.screen.enter .scroll>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.bar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px) * 0) 18px 12px;background:#FAF9F0e8;backdrop-filter:blur(12px);box-shadow:0 1px 0 #0000000a,0 6px 18px -14px #0003;z-index:4;min-height:64px;flex:none}
.bar .t{flex:1;min-width:0}.bar .t b{display:block;font:700 18px/1.2 var(--head)}.bar .t small{color:var(--olive);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.logo{display:flex;align-items:center;gap:6px;font:800 20px var(--head);color:var(--ink);flex:1}.logo .i{color:var(--caramel);width:24px;height:24px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--oat2);flex:none;font-size:16px;position:relative;transition:transform .15s}
.ib.brown{background:var(--caramel);color:#fff}
.ib .badge{position:absolute;top:-4px;right:-4px;background:var(--apricot);color:var(--cocoa);font:700 10px/17px var(--body);min-width:17px;border-radius:9px;text-align:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 18px 120px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none;overscroll-behavior:contain}
.scroll>*{flex:none}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}

.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:10px}
.mute{color:var(--mute)}.sm{font-size:12px}.xs{font-size:10.5px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--caramel)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--oat2);white-space:nowrap}
.tag.b{background:var(--butter);color:#45461c}.tag.r{background:var(--rose-s);color:#7b363b}.tag.a{background:var(--apricot);color:var(--cocoa)}.tag.w{background:#ffffffe6}.tag.d{background:#1c1d17b8;color:#fff}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 14px 34px -24px #5a4a2066}
.soft{background:var(--oat);border-radius:22px;padding:16px}
.butter{background:var(--butter-s);border-radius:18px;padding:13px 15px}
.price{font-family:var(--head);font-weight:800;font-variant-numeric:tabular-nums}
.was{text-decoration:line-through;color:var(--mute);font-size:12px;font-weight:500}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px 20px;border-radius:99px;background:var(--apricot);color:var(--cocoa);font-weight:700;text-align:center;position:relative;overflow:hidden;box-shadow:0 12px 24px -14px #b3762acc;transition:transform .15s}
.cta.dark{background:var(--char);color:#fff;box-shadow:0 12px 24px -14px #000a}.cta.brown{background:var(--caramel);color:#fff}.cta.olive{background:var(--olive);color:#fff}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);animation:sheen 4.5s 1s infinite}
@keyframes sheen{0%{left:-60%}30%,100%{left:130%}}
.mini{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;background:var(--apricot);color:var(--cocoa);font-size:11.5px;font-weight:700;white-space:nowrap;transition:transform .15s}
.mini.dark{background:var(--char);color:#fff}.mini.pale{background:var(--oat2);color:var(--ink)}.mini.brown{background:var(--caramel);color:#fff}
button:active{transform:scale(.96)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:99px;background:var(--oat2);font-size:12px;font-weight:700;white-space:nowrap;transition:.3s var(--ease)}
.chip.on{background:var(--apricot);color:var(--cocoa)}.chip.on.alt{background:var(--butter);color:#45461c}.chip.dk.on{background:var(--char);color:#fff}
.hs{display:flex;gap:9px;overflow-x:auto;margin:0 -18px;padding:2px 18px;scrollbar-width:none;flex:none}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--oat2);border-radius:18px;padding:4px}
.seg>i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));translate:calc(var(--x)*100%) 0;background:#fff;border-radius:14px;box-shadow:0 4px 12px -6px #0004;transition:translate .45s var(--ease)}
.seg button{position:relative;text-align:center;padding:9px 6px;font-weight:700;font-size:12px;line-height:1.25}
.seg button b{display:block;font:800 20px var(--head)}
.sw{width:46px;height:27px;border-radius:99px;background:#cbc9b8;position:relative;flex:none;transition:.3s}
.sw::after{content:"";position:absolute;width:21px;height:21px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.35s var(--ease)}
.sw.on{background:var(--olive)}.sw.on::after{left:22px}
.tick{width:24px;height:24px;border-radius:50%;background:var(--oat2);display:grid;place-items:center;flex:none;color:transparent;font-size:13px;transition:.3s var(--ease)}
.on>.tick,.tick.on{background:var(--olive);color:#fff;animation:pop .4s var(--ease)}
@keyframes pop{50%{transform:scale(1.25)}}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:18px;background:var(--oat);transition:.35s var(--ease);box-shadow:0 0 0 1.5px transparent inset}
.opt.on{background:#fff;box-shadow:0 14px 28px -20px #5a4a2088,0 0 0 1.5px #f2b66d66 inset}
.opt:not(.on) .thumb{filter:saturate(.55)}
.thumb{width:46px;height:46px;border-radius:13px;object-fit:cover;flex:none}
.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;background:var(--butter-s);color:var(--caramel)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--oat2);border-radius:99px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700}
.stepper button.plus{background:var(--apricot)}.stepper button:disabled{opacity:.35}
.stepper b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:9px;background:var(--oat2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:var(--apricot);width:var(--w);transition:width .7s var(--ease),background .4s}
input[type=range]{width:100%;appearance:none;height:7px;border-radius:9px;background:linear-gradient(90deg,var(--apricot) var(--p),var(--oat2) var(--p));margin:12px 0 6px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:6px solid var(--caramel);box-shadow:0 3px 9px #0004}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:6px solid var(--caramel)}

.foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:16px;padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px) * 0);background:#FAF9F0ee;backdrop-filter:blur(14px);box-shadow:0 -12px 26px -20px #0005;z-index:5}
.foot .cta{flex:1}.foot .price{font-size:26px;line-height:1.1}
.nav{position:absolute;left:18px;right:18px;bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);background:#ffffffee;backdrop-filter:blur(14px);border-radius:30px;padding:6px;box-shadow:0 18px 40px -16px #3a321566;z-index:6}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:24px;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--mute);transition:.3s}
.nav button .i{width:20px;height:20px}.nav button.on{background:var(--apricot);color:var(--cocoa)}
.float{position:absolute;left:18px;right:18px;bottom:86px;display:flex;align-items:center;gap:12px;background:var(--char);color:#fff;border-radius:22px;padding:10px 10px 10px 14px;box-shadow:0 18px 30px -14px #000a;z-index:6}
.screen.enter .float{animation:rise .6s .25s var(--ease) both}
.bump{animation:bump .5s var(--ease)}@keyframes bump{40%{transform:scale(1.06)}}

.hero{position:relative;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.screen.enter .hero img{animation:ken 9s ease-out both}
@keyframes ken{from{transform:scale(1.16)}}
.steam{position:absolute;left:50%;top:22%;width:120px;height:90px;translate:-50% 0;pointer-events:none}
.steam i{position:absolute;bottom:0;width:22px;height:60px;border-radius:50%;background:#fff;filter:blur(13px);opacity:0;animation:steam 4s infinite ease-in-out}
.steam i:nth-child(1){left:18px}.steam i:nth-child(2){left:54px;animation-delay:1.3s}.steam i:nth-child(3){left:86px;animation-delay:2.5s}
@keyframes steam{20%{opacity:.5}100%{opacity:0;transform:translate(14px,-70px) scale(1.7)}}
.over{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.kit{border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 22px 44px -28px #5a4a2099}
.kit .head{padding:14px 16px}.kit .head.a{background:var(--apricot)}.kit .head.b{background:var(--butter)}.kit .head.r{background:var(--rose)}
.pouches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pouch{background:var(--oat);border-radius:13px;padding:8px 11px;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.pouch b{color:var(--caramel);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.tile{background:#fff;border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 14px 30px -24px #5a4a2088;min-width:0}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;transition:transform .5s var(--ease)}
.tile:hover img{transform:scale(1.03)}
.ph{position:relative;overflow:hidden;border-radius:14px}.ph .tag{position:absolute;top:7px;left:7px}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#veil{position:absolute;inset:0;background:#1c1d1766;z-index:20;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:var(--cream);border-radius:30px 30px 0 0;padding:12px 18px 24px;z-index:21;display:flex;flex-direction:column;gap:12px;animation:up .45s var(--ease) both}
#sheet>*{flex:none}#sheet::before{content:"";width:44px;height:5px;border-radius:5px;background:#cfcdbb;margin:0 auto}
@keyframes up{from{transform:translateY(100%)}}
#toast{position:absolute;left:18px;right:18px;top:74px;z-index:40;pointer-events:none;display:flex;justify-content:center}
#toast div{background:var(--char);color:#fff;border-radius:99px;padding:10px 18px;font-size:12.5px;font-weight:700;box-shadow:0 14px 28px -12px #000a;animation:toast 2.4s var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translateY(-14px)}12%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.fly{position:absolute;width:46px;height:46px;border-radius:50%;object-fit:cover;z-index:30;pointer-events:none;box-shadow:0 8px 20px #0006;border:2px solid #fff}

/* intro and sealing ceremony */
#intro{position:absolute;inset:0;z-index:50;background:var(--olive);color:#F8F7DE;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;transition:.8s var(--ease)}
#intro.gone{translate:0 -102%}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro>div{position:relative;display:flex;flex-direction:column;gap:14px}
#intro h1{font-size:44px;line-height:1.05}#intro em,.serif{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600}
#intro em{color:var(--apricot)}
#seal{position:absolute;inset:0;z-index:35;background:#2f3229;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff;animation:fade .3s both;text-align:center;padding:24px}
.sleeve{position:relative;width:220px;height:270px}
.sleeve .bag{position:absolute;inset:40px 15px 0;background:linear-gradient(105deg,#cfa874,#e2c08c 45%,#c59c66);border-radius:8px 8px 22px 22px;box-shadow:0 30px 50px -20px #000c;z-index:2}
.sleeve .flap{position:absolute;left:15px;right:15px;top:40px;height:54px;background:#d9b57f;border-radius:6px 6px 40px 40px;transform-origin:top;transform:rotateX(180deg);z-index:3;animation:flap .6s 1.7s var(--ease) forwards}
@keyframes flap{to{transform:rotateX(0)}}
.sleeve .drop{position:absolute;left:50%;top:-70px;translate:-50% 0;z-index:1;background:#fffbe9;color:var(--cocoa);font-size:12px;font-weight:700;padding:8px 14px;border-radius:12px;white-space:nowrap;opacity:0;animation:drop .75s var(--ease) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(0) rotate(-9deg)}25%{opacity:1}100%{opacity:1;transform:translateY(190px) rotate(5deg)}}
.sleeve .label{position:absolute;left:40px;right:40px;top:150px;z-index:3;background:#FAF9F0;color:var(--ink);border-radius:6px;padding:10px;font:700 12px/1.35 var(--head)}
.sleeve .wax{position:absolute;z-index:4;left:50%;top:66px;width:62px;height:62px;margin-left:-31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a46e22,#6d450d);display:grid;place-items:center;font-size:28px;box-shadow:0 6px 14px #0007;opacity:0;animation:stamp .5s 2.3s var(--ease) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-30deg)}70%{opacity:1;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}

.ring{position:relative;display:grid;place-items:center;margin:auto}
.ring svg{rotate:-90deg}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .v{stroke-dasharray:100;stroke-dashoffset:var(--o);transition:stroke-dashoffset 1s linear,stroke .4s}
.ring>div{position:absolute;text-align:center}
.big{font:800 46px/1 var(--head);font-variant-numeric:tabular-nums}
.map{position:relative;height:150px;border-radius:18px;background:#EDEDE0;overflow:hidden}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .road{stroke:#fff;stroke-width:6;fill:none}
.map .path{stroke:var(--caramel);stroke-width:3;stroke-dasharray:7 6;fill:none;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-13}}
.stages{display:grid;grid-template-columns:repeat(4,1fr);position:relative;text-align:center;font-size:10px;font-weight:700}
.stages::before,.stages::after{content:"";position:absolute;left:12.5%;top:13px;height:2px;background:var(--oat2);width:75%}
.stages::after{background:var(--caramel);width:var(--w);transition:width .9s linear}
.stages div{position:relative;z-index:1;color:var(--mute)}
.stages i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 5px;border-radius:50%;background:var(--oat2);font-style:normal}
.stages .done{color:var(--ink)}.stages .done i{background:var(--caramel);color:#fff}
.stages .now{color:var(--caramel)}.stages .now i{background:var(--apricot);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #f2b66daa}100%{box-shadow:0 0 0 12px #f2b66d00}}
.slide{position:relative;flex:1;height:58px;border-radius:99px;background:var(--apricot);color:var(--cocoa);display:grid;place-items:center;font-weight:700;touch-action:none;user-select:none;overflow:hidden;padding-left:44px;font-size:13.5px}
.slide .knob{position:absolute;left:5px;top:5px;width:48px;height:48px;border-radius:50%;background:var(--char);color:#fff;display:grid;place-items:center;font-size:20px;cursor:grab}
.eq{display:flex;gap:3px;align-items:center;height:22px}.eq i{width:4px;height:100%;border-radius:4px;background:var(--olive);animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.6s}@keyframes eq{50%{height:25%}}
.eq.off i{animation:none;height:25%;opacity:.4}
.confetti{position:absolute;top:-12px;width:8px;height:13px;border-radius:3px;z-index:45;pointer-events:none}
.scan{position:relative;height:170px;border-radius:20px;background:#22231a;overflow:hidden;display:grid;place-items:center;color:#fff}
.scan i{position:absolute;left:10%;right:10%;height:3px;background:var(--apricot);box-shadow:0 0 18px 4px #f2b66d;animation:scan 1.6s infinite alternate ease-in-out}
@keyframes scan{from{top:12%}to{top:86%}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{text-align:center;border-radius:14px;background:var(--oat2);padding:8px 0;font-size:9.5px;font-weight:700;transition:.3s}
.days button b{display:block;font:800 17px var(--head)}.days button.on{background:var(--caramel);color:#fff}
.flash{animation:flash 1.2s ease}@keyframes flash{30%{box-shadow:0 0 0 3px var(--apricot)}}

function ping(f=620,d=.07){if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}if(!soundOn)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

function fly(from,name){const a=$('#app').getBoundingClientRect(),t=$('.screen:not(.leave) [data-cart]');if(!t)return;const f=from.getBoundingClientRect(),to=t.getBoundingClientRect(),k=a.width/$('#app').offsetWidth||1;const e=document.createElement('img');e.src=IMG[name];e.className='fly';$('#app').append(e);const p=r=>[(r.left+r.width/2-a.left)/k-23,(r.top+r.height/2-a.top)/k-23];const[x1,y1]=p(f),[x2,y2]=p(to);e.animate([{transform:`translate(${x1}px,${y1}px) scale(1)`},{transform:`translate(${(x1+x2)/2}px,${Math.min(y1,y2)-90}px) scale(1.25)`,offset:.45},{transform:`translate(${x2}px,${y2}px) scale(.25)`}],{duration:750,easing:'ease-in-out'}).onfinish=()=>{e.remove();t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump');ping(880)};e.style.left=e.style.top='0'}

/* patch the live DOM so CSS transitions, sliders and scroll survive updates */
function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
 if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 if(a.nodeType!==1)return;
 for(const{name}of[...a.attributes])if(!b.hasAttribute(name))a.removeAttribute(name);
 for(const{name,value}of[...b.attributes])if(a.getAttribute(name)!==value)a.setAttribute(name,value);
 if(a.nodeName==='INPUT'){if(document.activeElement!==a)a.value=b.getAttribute('value')||'';return}
 const x=[...a.childNodes],y=[...b.childNodes];
 y.forEach((n,i)=>x[i]?morph(x[i],n):a.append(n.cloneNode(true)));
 x.slice(y.length).forEach(n=>n.remove());
}

<div class="soft row"><span class="dot">${ic('sprout')}</span><div class="grow"><h3>Zero-leftover guarantee</h3><p class="sm mute">Every sleeve holds the gram-exact quantity your dinner calls for.</p></div></div>`,nav('recipes'))};

const PP=[['rice_pouch','Basmati Rice Pouch','100g solo','Exact 1 cup',16],['peas','Tender Green Peas','50g pouch','Sweet & tender',12],['onion_s','Fresh Single Red Onion','1 pc ~70g','No half-onion waste',4],['carrot','Fresh Tender Carrot','1 pc ~60g','No peel waste',6],['spices','Solo Spices & Ghee Pod','Aroma sachet','Chef calibrated',15]];
const pulaoGross=()=>S.pSel.reduce((a,i)=>a+PP[i][4],0)*S.pServ;

V.pulao=()=>{const q=S.pServ;const steps=[['Sauté aromatics','1.5 mins','Warm the ghee pod over medium heat. Tip in whole spices and sliced onion. Stir for 90 seconds until translucent golden.'],['Combine produce & rice','1 min','Add carrot, peas and rice. Coat the grains gently in the fragrant ghee.'],['Simmer & fluff','8 mins',`Add ${180*q}ml water, cover with the lid and simmer. Rest, then fluff.`]];return page(subBar('Recipe Detail','Single-portion craft kit',`<button class="ib" style="${S.saved.includes('pulao')?'background:var(--apricot)':''}" data-act="bookmark" data-arg="pulao" aria-label="Save recipe">${ic('bookmark')}</button>`),`
<div class="hero" style="height:250px;margin:-16px -18px 0">${img('pulaohero','')}<span class="steam"><i></i><i></i><i></i></span><span class="over" style="left:14px;top:14px"><span class="tag w">${ic('bolt')}10m pod delivery</span></span><span class="over" style="right:14px;top:14px"><span class="tag b">${ic('leaf')}340g waste saved</span></span><span class="over" style="left:14px;bottom:12px"><span class="tag w">1-pot / 0.8L</span><span class="tag w">385 kcal</span><span class="tag w">14 mins</span></span></div>
<div><h1>Vegetable Pulao</h1><p class="mute" style="margin-top:6px">Fragrant spiced basmati with sweet green peas, diced carrot and tempered ghee.</p></div>
<div class="soft row"><div class="grow"><h3>Portion scaler <span class="tag r">${q===1?'Solo fit':q+' servings'}</span></h3><p class="sm mute">Adjusts sachet grammage and liquid volume</p></div><div class="stepper"><button data-act="pserv" data-arg="-1" ${q<2?'disabled':''} aria-label="Fewer servings">${ic('minus')}</button><b>${q}</b><button class="plus" data-act="pserv" data-arg="1" ${q>3?'disabled':''} aria-label="More servings">${ic('plus')}</button></div></div>
<button class="butter row" data-act="psync" aria-pressed="${S.pSync}"><span class="dot">${ic('box')}</span><span class="grow"><h3>Smart pantry sync <span class="tag a">Save ₹15</span></h3><span class="sm mute">Deduct salt, oil and staples you have at home</span></span><span class="sw ${S.pSync?'on':''}"></span></button>
<section class="col"><div class="row between"><h2>Sealed pouches</h2><button class="mini pale" data-act="pall">${S.pSel.length===5?'Deselect all':'Select all'}</button></div><p class="sm mute">${S.pSel.length} of 5 selected, weighed to the gram.</p>${PP.map((p,i)=>`<button class="opt ${S.pSel.includes(i)?'on':''}" data-act="psel" data-arg="${i}"><span class="tick">${ic('check')}</span>${img(p[0])}<span class="grow"><b class="hd">${p[1]}</b><br><span class="xs mute">${p[2]}${q>1?' ×'+q:''} • ${p[3]}</span></span><b class="price">${R(p[4]*q)}</b></button>`).join('')}</section>
<button class="hero" data-act="technique" style="height:150px;border-radius:22px;width:100%" aria-label="Play 30 second technique preview">${img('saute','')}<span style="position:absolute;inset:0;background:linear-gradient(0deg,#000b,#0002)"></span><span class="row" style="position:absolute;left:16px;right:16px;bottom:16px;color:#fff"><span class="grow"><span class="tag a">Solo technique</span><br><b class="hd" style="font-size:17px">30s one-pot walkthrough</b></span><span class="ib" style="background:#fff;color:var(--caramel);width:48px;height:48px">${ic('play')}</span></span></button>
<section class="col"><div class="row between"><h2>1-pot solo recipe</h2><span class="tag b">3 steps</span></div>${steps.map((s,i)=>`<button class="opt ${S.pStep===i?'on':''}" style="align-items:flex-start" data-act="pstep" data-arg="${i}" aria-expanded="${S.pStep===i}"><span class="tag ${S.pStep===i?'a':''}">${i+1}</span><span class="grow"><span class="row between"><b class="hd">${s[0]}</b><span class="xs">${s[1]}</span></span>${S.pStep===i?`<p class="sm mute" style="margin-top:7px">${s[2]}</p>`:''}</span></button>`).join('')}<div class="soft row">${ic('drop')}<p class="sm grow"><b>Water gauge:</b> ${180*q}ml is about ${q===1?'¾ of a':(q*.75)+' × a'} standard drinking mug.</p></div></section>`,
`<footer class="foot"><div><span class="price">${R(pulaoNet())}</span> <span class="was">${S.pSync?R(pulaoGross()):''}</span><div class="xs mute">For ${q}${S.pSync&&S.pSel.length?' • pantry saved ₹15':''}</div></div><button class="cta" data-act="addPulao">${S.pSel.length?'Add kit to box '+ic('arrow'):'Pick a pouch'}</button></footer>`)};

const K={base:{fett:['Durum Fettuccine','75g solo nest • bronze-die',18,75,'fett'],basm:['Aged Dehradun Basmati','85g kraft pouch • 2-year grain',16,85,'basm'],sour:['Sourdough Tear Nodule','90g solo loaf • wild ferment',20,90,'sour']},
veg:{cherry:['Cherry Tomatoes','120g • 6 pcs vine-ripened',14,120,'drop'],mush:['Button Mushrooms','60g precision-sliced',16,60,'sprout'],spin:['Baby Spinach','40g triple-washed',10,40,'leaf'],garlic:['Crushed Garlic','10g from home stock • pantry matched',0,10,'sun']},
prot:{paneer:['Malai Paneer','100g pouch',38,100,'kpaneer'],egg:['Farm Egg','1 pc pulp pod',8,55,'egg'],tofu:['Golden Tofu','90g marinated',32,90,'tofu']},
fat:{oil:['Garlic & Olive Oil Pod','20ml • cold-pressed, roasted garlic',12,20,'drop'],coulis:['Smoked Herb Coulis','40ml • oak-smoked tomato & basil',16,40,'flame']},
pan:{skillet:['pan','20cm Skillet',12,'180ml'],pot:['bowl','0.8L Mini Pot',10,'150ml'],fryer:['fan','1.5L Air Fryer',14,'60ml']}};
const kitParts=()=>{const k=S.kit,b=K.base[k.base],h=k.hungry;return[[b[0]+(h?' (Hungry)':' (Solo)'),b[2]+(h?5:0),b[3]+(h?25:0)],...k.veg.map(v=>[K.veg[v][0],K.veg[v][2],K.veg[v][3]]),...(k.prot?[[K.prot[k.prot][0],K.prot[k.prot][2],K.prot[k.prot][3]]]:[]),[K.fat[k.fat][0],K.fat[k.fat][2],K.fat[k.fat][3]]]};
const kitPrice=()=>kitParts().reduce((a,p)=>a+p[1],0),kitG=()=>kitParts().reduce((a,p)=>a+p[2],0);
const num=(n,t)=>`<h2><span class="tag" style="background:var(--caramel);color:#fff">${n}</span> ${t}</h2>`;
V.builder=()=>{const k=S.kit,g=kitG(),fill=Math.round(g/5),pan=K.pan[k.pan];const opt=(grp,key,x,on,lead)=>`<button class="opt ${on?'on':''}" data-act="kit" data-arg="${grp}:${key}">${lead}<span class="grow"><b class="hd">${x[0]}</b><br><span class="xs mute">${x[1]}</span></span><b class="price">${R(x[2])}</b><span class="tick">${ic('check')}</span></button>`;return page(subBar('Kit Builder','Apothecary lab'),`
<div><h1>Craft your solo sleeve</h1><p class="sm mute" style="margin-top:6px">A single-serving kit, optimised for your pan.</p></div>
<div class="soft col" style="position:sticky;top:-16px;z-index:3;box-shadow:0 18px 26px -22px #0007"><div class="row between"><div><span class="eyebrow">● Live sleeve spec</span><div><b class="hd" style="font-size:27px" data-tick="kg">${g}</b><b>g</b> &nbsp;<b class="price" style="font-size:25px;color:var(--caramel)">₹<span data-tick="kp">${kitPrice()}</span></b> <span class="was">${R(kitPrice()+16)}</span></div></div><span class="tag b">${ic('leaf')}Zero waste</span></div><div class="row between xs"><span>Pan fill (${pan[1]})</span><b>${fill}% ${fill>90?'• crowded':fill<55?'• roomy':'• ideal'}</b></div><div class="meter"><i style="--w:${Math.min(100,fill)}%;${fill>90?'background:var(--red)':''}"></i></div></div>
<section class="col">${num(1,'Base carb / grain')}${Object.entries(K.base).map(([i,x])=>opt('base',i,x,k.base===i,img(x[4]))).join('')}<span class="eyebrow">Calibration yield</span>${seg('hungry',[[0,'Solo portion'],[1,'Hungry +25g (+₹5)']],k.hungry?1:0)}</section>
<section class="col">${num(2,'Produce & fresh pack')}<p class="sm mute">Washed, trimmed and precision-weighed.</p>${Object.entries(K.veg).map(([i,x])=>opt('veg',i,x,k.veg.includes(i),`<span class="dot" style="background:${i==='cherry'?'var(--rose-s)':i==='garlic'?'var(--apricot-s)':'var(--butter-s)'}">${ic(x[4])}</span>`)).join('')}${k.veg.includes('garlic')?`<div class="butter sm">${ic('check')} Garlic deducted from your pantry (₹2 saved).</div>`:''}</section>
<section class="col">${num(3,'Protein core')}<p class="sm mute">Optional boost. Tap again to remove.</p><div class="three">${Object.entries(K.prot).map(([i,x])=>`<button class="opt ${k.prot===i?'on':''}" style="flex-direction:column;align-items:flex-start;gap:5px;padding:8px" data-act="kit" data-arg="prot:${i}">${img(x[4],'','style="width:100%;height:64px;object-fit:cover;border-radius:12px"')}<span class="xs mute">${x[1]}</span><b class="hd">${x[0]}</b><span class="row between" style="width:100%"><b>${R(x[2])}</b><span class="tick ${k.prot===i?'on':''}">${ic('check')}</span></span></button>`).join('')}</div></section>
<section class="col">${num(4,'Flavour ampoule')}${Object.entries(K.fat).map(([i,x])=>opt('fat',i,x,k.fat===i,`<span class="dot" style="background:var(--apricot-s)">${ic(x[4])}</span>`)).join('')}</section>
<section class="col">${num(5,'Pan & physics calibration')}${seg('kpan',Object.entries(K.pan).map(([i,x])=>[i,ic(x[0])+'<br>'+x[1]]),k.pan)}<div class="two"><div class="card"><span class="eyebrow">Cook time</span><div class="hd" style="font-size:21px">${pan[2]} mins</div></div><div class="card"><span class="eyebrow">Water required</span><div class="hd" style="font-size:21px">${pan[3]}</div></div></div></section>
<section class="soft col"><div><span class="eyebrow">Sleeve manifest • #C-104</span><h2>Your solo parcel</h2></div><div class="card col" style="gap:7px">${kitParts().map((p,i)=>`<div class="row sm"><span style="color:var(--caramel)">●</span><span class="grow">${p[0]}</span><span class="xs mute">${p[2]}g • Pouch 0${i+1}</span></div>`).join('')}</div><label class="eyebrow" for="kn">Name this sleeve</label><input id="kn" class="card" style="border:0;padding:12px;font:700 15px var(--head);width:100%" maxlength="40" value="${k.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" data-input="kname"><button class="row" data-act="journal" aria-pressed="${k.journal}"><span class="tick ${k.journal?'on':''}">${ic('check')}</span><span class="sm grow">Save to my Solo Journal for 1-tap reorder</span></button></section>`,
`<footer class="foot"><div><span class="price">₹<span data-tick="kp2">${kitPrice()}</span></span><div class="xs mute">${g}g • 1 serving</div></div><button class="cta" data-act="sealKit">Seal sleeve & add ${ic('arrow')}</button></footer>`)};

V.market=()=>{const tabs=['Single veggies','Micro grains & pasta','1-serve extras'],c=['veg','grain','one'].indexOf(S.cat);const keys=Object.keys(ITEMS).filter(k=>ITEMS[k][5]===c);return page(topLogo(),`

<div class="soft col"><span class="eyebrow">${ic('scale')} Solo kitchen math</span><p>The average urban cook discards <b style="color:var(--plum)">42% of coriander bunches</b> and <b>1.5 sprouted onions</b> every week.</p><div class="card col" style="gap:6px"><div class="row between xs"><b>Traditional 1kg grocery bag</b><b style="color:var(--red)">~400g waste</b></div><div class="meter"><i style="--w:40%;background:var(--red)"></i></div><div class="row between xs"><b>Portion micro grocery</b><b style="color:var(--olive)">0g rot</b></div><div class="meter"><i style="--w:100%;background:var(--olive)"></i></div></div></div>
<div class="card row"><span class="dot">${ic('leaf')}</span><div class="grow"><h3>Packed in compostable glassine</h3><p class="sm mute">No cling-wrap. Each piece is ripeness-checked before dispatch.</p></div></div>`,
(count()?`<button class="float" data-act="go" data-arg="cart" data-cart><span class="ib" style="background:#ffffff22">${ic('bag')}<span class="badge">${count()}</span></span><span class="grow"><b>${count()} item${count()>1?'s':''} • ${grams()}g</b><br><b style="color:var(--apricot)">${R(food())}</b></span><span class="mini" style="padding:11px 15px">View box ${ic('arrow')}</span></button>`:'')+nav('market'),'padding-bottom:180px')};

V.cart=()=>{if(!count())return page(subBar('Cart & Checkout','Portion kitchen'),`<div class="soft col" style="text-align:center;align-items:center;padding:40px 20px;margin-top:40px"><span class="dot">${ic('bag')}</span><h2>Your box is empty</h2><p class="sm mute">Add a meal sleeve or a few loose pieces to start.</p><button class="cta" data-act="go" data-arg="recipes">Browse recipe sleeves</button></div>`);
const t=food(),pantry=sum(x=>x.pantry),fresh=t-pantry,pf=t?Math.round(fresh/t*100):0,saved=wasTotal()-t;
return page(subBar('Cart & Checkout','Portion kitchen'),`
<div class="row between"><span class="tag r">● Zero-waste reconciler</span><span class="tag b">${ic('check')}100% calibrated</span></div>
${S.meals.map((m,i)=>`<article class="kit"><div class="head a row between"><span class="eyebrow" style="color:var(--cocoa)">Meal sleeve</span><span class="tag w">${m.g*m.qty}g</span></div><div class="col" style="padding:14px"><div class="row" style="align-items:flex-start">${img(m.img,'thumb','style="width:74px;height:74px"')}<div class="grow"><h3>${m.name}</h3><div class="stepper" style="width:max-content;margin-top:8px"><button data-act="mqty" data-arg="${i}:-1" aria-label="Remove one">${ic('minus')}</button><b>${m.qty}</b><button class="plus" data-act="mqty" data-arg="${i}:1" aria-label="Add one">${ic('plus')}</button></div></div><b class="price" style="font-size:19px">${R(m.price*m.qty)}</b></div><span class="eyebrow" style="text-align:center">Sealed pouches</span><div class="pouches">${m.pouches.map(p=>`<div class="pouch"><span class="clip">${p[2]}</span><b>${p[0]}${p[1]}</b></div>`).join('')}</div></div></article>`).join('')}
${looseCount()?`<section class="col"><div class="row between"><h2>${ic('scale')} Exact loose picks</h2><span class="xs mute">No rotten leftovers</span></div>${Object.entries(S.loose).map(([k,q])=>`<div class="card row" style="padding:11px">${img(k)}<div class="grow"><b class="hd">${ITEMS[k][0]}</b><br><span class="xs mute">${ITEMS[k][4]}</span></div><b>${R(ITEMS[k][2]*q)}</b><div class="stepper"><button data-act="qty" data-arg="${k}:-1" aria-label="Remove one">${ic('minus')}</button><b>${q}</b><button class="plus" data-act="qty" data-arg="${k}:1" aria-label="Add one">${ic('plus')}</button></div></div>`).join('')}</section>`:''}
<div class="soft col"><div class="row between"><span class="eyebrow" style="color:var(--ink)">Transparent economics split</span><span class="tag">Zero markup</span></div><div class="meter" style="background:#CCCB8C;height:11px"><i style="--w:${pf}%"></i></div><div class="two">${[['Tonight\'s meal',fresh,pf,'Fresh produce used now','var(--apricot)'],['Micro-pantry pod',pantry,100-pf,'Ambient pods that keep','#CCCB8C']].map(a=>`<div class="card" style="padding:12px"><b class="xs"><span style="color:${a[4]}">●</span> ${a[0]}</b><div><b class="price" style="font-size:21px">${R(a[1])}</b> <span class="xs mute">(${a[2]}%)</span></div><span class="xs mute">${a[3]}</span></div>`).join('')}</div><p class="sm mute serif">“You never pay for what rots in the crisper drawer.”</p></div>

<div class="butter row">${ic('leaf')}<span class="grow">Net food waste from this order: <b>0.0 grams</b></span></div>`,

function tickers(root){root.querySelectorAll('[data-tick]').forEach(n=>{const k=n.dataset.tick,to=+n.textContent,from=ticks[k];ticks[k]=to;if(from===undefined||from===to)return;const t0=performance.now();const step=t=>{if(ticks[k]!==to)return;const p=Math.min(1,(t-t0)/450);n.textContent=Math.round(from+(to-from)*(1-(1-p)**3));if(p<1)requestAnimationFrame(step)};n.textContent=from;requestAnimationFrame(step)})}

 if(!V[id])id='home';if(id===cur)return closeSheet();

 setTimeout(()=>s.classList.remove('enter','back'),1300);

 /* sync children without touching the screen element's own animation classes */
 const x=[...s.childNodes],y=[...b.childNodes];y.forEach((n,i)=>x[i]?morph(x[i],n):s.append(n));x.slice(y.length).forEach(n=>n.remove());save();after()}

function bindSlide(){const t=$('#slide',el());if(!t||t.dataset.b)return;t.dataset.b=1;const k=$('.knob',t);let x0=null,dx=0,max=0;
 k.onpointerdown=e=>{x0=e.clientX;max=t.clientWidth-58;k.setPointerCapture(e.pointerId);k.style.transition='none'};
 k.onpointermove=e=>{if(x0===null)return;const scale=t.getBoundingClientRect().width/t.offsetWidth||1;dx=Math.max(0,Math.min(max,(e.clientX-x0)/scale));k.style.translate=dx+'px';t.firstElementChild.style.opacity=1-dx/max};
 k.onpointerup=k.onpointercancel=e=>{if(x0===null)return;x0=null;k.style.transition='.35s';if(dx>max*.82&&e.type==='pointerup'){k.dataset.dragged=1;placeOrder()}else{if(dx>6)k.dataset.dragged=1;else delete k.dataset.dragged;k.style.translate='0';t.firstElementChild.style.opacity=1;if(dx<=6&&e.type==='pointerup'&&e.pointerType!=='keyboard')toast('Slide the knob all the way to dispatch');}dx=0}}

/* intro: grains settling into a pouch */
function intro(){const box=$('#intro'),c=$('canvas',box),x=c.getContext('2d');const W=c.width=c.offsetWidth*2,H=c.height=c.offsetHeight*2;const C=['#E7E5A6','#F2B66D','#F2B0B2','#FAF9F0'];
 const P=[...Array(90)].map((_,i)=>({x:Math.random()*W,y:Math.random()*H*.62,r:3+Math.random()*7,v:.5+Math.random()*1.7,a:Math.random()*6,c:C[i%4]}));
 const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
 (function f(){if(!box.isConnected)return;x.clearRect(0,0,W,H);for(const p of P){p.y+=p.v;p.a+=.015;if(p.y>H*.64){p.y=-10;p.x=Math.random()*W}x.save();x.translate(p.x+Math.sin(p.a)*14,p.y);x.rotate(p.a);x.globalAlpha=.7*(1-Math.max(0,p.y-H*.4)/(H*.24));x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.r*1.7,p.r*.8,0,0,7);x.fill();x.restore()}if(!still)requestAnimationFrame(f)})()}

$('#guide ol').innerHTML=SCREENS.map(s=>`<li><button data-act="go" data-arg="${s[0]}">${s[1]}</button></li>`).join('');
A.enter=a=>{$('#intro').classList.add('gone');setTimeout(()=>$('#intro')?.remove(),850);go(a)};NOREDRAW.add('enter');
A.reset=()=>{try{localStorage.removeItem('portion-v1')}catch(e){}S=DEF();hist=[];CK.run=false;const c=cur;cur=null;$('#views').innerHTML='';go(c||'home');toast('Demo reset')};NOREDRAW.add('reset');
A.sfx=(a,b)=>{soundOn=!soundOn;b.textContent='Sound: '+(soundOn?'on':'off');ping()};NOREDRAW.add('sfx');
const start=location.hash.slice(1);
if(V[start]){$('#intro').remove();go(start)}else{go('home');intro()}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==cur){$('#intro')?.remove();go(h)}});

</script>
