name: Android cloud build & preview

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portion-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android && node scripts/patch-android.mjs; fi
          npx @capacitor/assets generate --android --iconBackgroundColor '#5F6130' --splashBackgroundColor '#5F6130' --splashBackgroundColorDark '#5F6130' || echo "icon generation skipped"
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Portion-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Portion-Android
          path: Portion-Android.apk
